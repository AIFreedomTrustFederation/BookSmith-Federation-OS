name: Workspace Verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.0.0 --activate

      - name: Verify inert install policy
        run: test "$(pnpm config get ignore-scripts)" = "true"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint workspaces
        run: pnpm run lint

      - name: Type-check workspaces
        run: pnpm run typecheck

      - name: Run workspace tests when present
        run: pnpm -r --if-present test

      - name: Build workspaces
        run: pnpm run build

      - name: Smoke-test web home page
        run: |
          set -euo pipefail
          corepack pnpm --filter @booksmith-federation-os/web-os exec next start --port 3100 --hostname 127.0.0.1 > "$RUNNER_TEMP/booksmith-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/ -o "$RUNNER_TEMP/booksmith-home.html" 2>/dev/null; then
              grep -Eq '<h1[^>]*>BookSmith Federation OS</h1>' "$RUNNER_TEMP/booksmith-home.html"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/booksmith-web.log"
          exit 1

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
